name: CI

# Runs `mise run setup` and `mise run check` (analyze, test, release APK build) with the toolchain
# pinned in mise.toml, the same as locally. Renovate automerges its update PRs only when this passes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: flutter java
      - run: mise run setup
      # Android SDK comes preinstalled on the runner (ANDROID_HOME).
      - run: mise run check
