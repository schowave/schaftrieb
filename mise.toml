# Toolchain for this app. Renovate keeps these versions current (mise manager).
# Flutter 3.50 (Dart 3.14, matches pubspec's sdk constraint). Its Gradle plugin, loaded from this SDK via
# dev.flutter.flutter-plugin-loader (android/settings.gradle.kts), requires Gradle >= 9.3.1, AGP >= 9.1.1
# and Kotlin Gradle plugin >= 2.4.10. JDK 25 runs Gradle 9.x / AGP 9.x.
[tools]
flutter = "3.50.0"
java = "temurin-25"

[tasks.get]
description = "Fetch Dart/Flutter packages"
run = "flutter pub get"

[tasks.analyze]
description = "Static analysis"
run = "flutter analyze"

[tasks.test]
description = "Run widget and unit tests"
run = "flutter test"

[tasks.build-android]
description = "Release APK build (R8, release config), so Gradle/AGP/Kotlin updates are checked too"
run = "flutter build apk --release"
